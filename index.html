<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mon espace LocWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icone-512.png">
<link rel="apple-touch-icon" href="icone-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LocWeb">
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>

<!-- ================= connexion ================= -->
<section class="connexion" id="ecran-connexion">
  <div class="connexion-boite">
    <p class="marque">Loc<em>Web</em></p>
    <p>Votre espace pour gérer votre site.</p>

    <form id="form-connexion" novalidate>
      <label class="champ">
        <span>Adresse e-mail</span>
        <input type="email" id="ident-email" autocomplete="username" required>
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input type="password" id="ident-mdp" autocomplete="current-password" required>
      </label>
      <p class="mot" data-ton="alerte" id="connexion-erreur"></p>
      <button class="bt bt-vif bt-large" type="submit" id="bt-connexion">Se connecter</button>
    </form>

    <p style="margin-top:14px;text-align:center">
      <button class="bt bt-nu" id="bt-oubli" type="button">Mot de passe oublié</button>
    </p>
  </div>
</section>

<!-- ================= espace connecte ================= -->
<div id="espace" style="display:none">

  <nav class="rail" aria-label="Navigation">
    <p class="marque rail-marque">Loc<em>Web</em></p>
    <div class="rail-nav">
      <a href="#/accueil" data-route="accueil">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10V20h13V10"/></svg>
        Accueil
      </a>
      <a href="#/statistiques" data-route="statistiques">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx="1"/><rect x="12" y="8" width="3" height="10" rx="1"/><rect x="17" y="5" width="3" height="13" rx="1"/></svg>
        Statistiques
      </a>
      <a href="#/mon-site" data-route="mon-site">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
        Mon site
      </a>
      <a href="#/demandes" data-route="demandes">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H8l-4 4V5Z"/></svg>
        Demandes
        <b class="pastille" id="pastille-activite" hidden>0</b>
      </a>
      <a href="#/publicite" data-route="publicite">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l6 4V6L7 10H3Z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
        Publicité
      </a>
    </div>

    <div class="rail-pied">
      <div class="rail-nav">
        <a href="#/compte" data-route="compte">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-6.2 7.5-6.2s7.5 2.6 7.5 6.2"/></svg>
          Mon compte
        </a>
        <a href="#/aide" data-route="aide">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 1.6-2.3 3.5"/><path d="M12 17.5h.01"/></svg>
          Aide
        </a>
      </div>
      <div class="rail-site">
        <span id="nom-site">—</span>
        <a id="lien-site" href="#" target="_blank" rel="noopener noreferrer" hidden>Voir mon site &rarr;</a>
      </div>
      <button class="bt bt-nu" id="bt-deconnexion">Se déconnecter</button>
    </div>
  </nav>

  <main class="zone">
    <header class="entete">
      <p class="entete-salut">Bonjour <b id="entete-nom">—</b></p>
      <div class="entete-droite">
        <a class="entete-lien" id="entete-site" href="#" target="_blank" rel="noopener noreferrer" hidden>Voir mon site</a>
        <a class="entete-icone" href="#/compte?onglet=connexions" data-route="compte" id="bt-reglages" title="Connexions" aria-label="Connexions">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </a>
        <button class="entete-icone" id="bt-theme" title="Changer de thème" aria-label="Changer de thème">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="menu-compte">
          <button class="entete-avatar" id="entete-avatar" aria-haspopup="true" aria-expanded="false">—</button>
          <div class="menu-deroulant" id="menu-compte" hidden>
            <p class="menu-entete"><b id="menu-nom">—</b><span id="menu-mail"></span></p>
            <a class="menu-item" href="#/compte">Mon compte</a>
            <a class="menu-item" href="#/compte?onglet=parrainage">Parrainage</a>
            <a class="menu-item" href="#/aide">Aide</a>
            <button class="menu-item menu-item-danger" id="bt-deconnexion-menu">Se déconnecter</button>
          </div>
        </div>
      </div>
    </header>
    <div class="page" id="page"></div>
  </main>
</div>

<script type="module" src="app.js?v=48"></script>
</body>
</html>
