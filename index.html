<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mon espace LocWeb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- ================= connexion ================= -->
<section class="connexion" id="ecran-connexion">
  <div class="connexion-boite">
    <p class="marque">Loc<em>Web</em></p>
    <p>Votre espace pour gerer votre site.</p>

    <form id="form-connexion" novalidate>
      <label class="champ">
        <span>Adresse e-mail</span>
        <input type="email" id="ident-email" autocomplete="username" required>
      </label>
      <label class="champ">
        <span>Mot de passe</span>
        <input type="password" id="ident-mdp" autocomplete="current-password" required>
      </label>
      <p class="mot" data-ton="alerte" id="connexion-erreur"></p>
      <button class="bt bt-vif bt-large" type="submit" id="bt-connexion">Se connecter</button>
    </form>

    <p style="margin-top:14px;text-align:center">
      <button class="bt bt-nu" id="bt-oubli" type="button">Mot de passe oublie</button>
    </p>
  </div>
</section>

<!-- ================= espace connecte ================= -->
<div id="espace" style="display:none">

  <header class="entete">
    <p class="marque">Loc<em>Web</em></p>
    <p class="site">Site : <strong id="nom-site">—</strong></p>
    <div class="droite">
      <a class="bt bt-plein" id="lien-site" href="#" target="_blank" rel="noopener noreferrer" hidden>Voir mon site</a>
      <button class="bt bt-nu" id="bt-deconnexion">Se deconnecter</button>
    </div>
  </header>

  <main id="page"></main>
</div>

<script type="module" src="admin.js?v=13"></script>
</body>
</html>
